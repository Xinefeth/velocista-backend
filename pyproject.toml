# Configuración del proyecto y herramientas. Código en inglés; comentarios en español.
[project]
name = "velocista-backend"
version = "0.1.0"
description = "Backend del sistema de pista (robot velocista + cronómetro + consola) — Clean Architecture"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "PyJWT>=2.10,<3",
    "websockets>=15,<18",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",        # cliente para tests e2e del REST/WS
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velocista"]

[tool.pytest.ini_options]
# Los tests viven fuera del paquete; añadimos src/ al path.
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
