services:
  - type: web
    name: velocista-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_REQUIRED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: velocista-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEVICE_TOKEN_ROBOT
        generateValue: true
      - key: DEVICE_TOKEN_TIMER
        generateValue: true
      - key: SIMULATION_SERVICE_TOKEN
        generateValue: true
databases:
  - name: velocista-db
    plan: free
    databaseName: velocista
    user: velocista
